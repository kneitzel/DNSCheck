openapi: 3.1.0
info:
  title: DNSCheck API
  version: 1.0.0
  description: DNS zone reconciliation and management API
servers:
  - url: /
    description: DNSCheck service
tags:
  - name: Auth
    description: Operator authentication
  - name: Reconciliation
    description: Zone reconciliation and service health
  - name: Zones
    description: Zone catalog management and introspection
  - name: ZoneView
    description: Merged live and managed zone inspection
  - name: Admin
    description: Operator, group, and rights management
  - name: Account
    description: Current operator account settings and personal keys
  - name: Keys
    description: Selectable and missing TSIG key summaries for zone operations
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Authenticate with username, password, and optional MFA code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials or MFA challenge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Session cleared
  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: Change password for the current operator
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password updated
        "401":
          description: Not authenticated or current password incorrect
  /api/v1/auth/me/rights:
    get:
      tags:
        - Auth
      operationId: getMyRights
      summary: Effective rights for the current operator
      security:
        - session: []
      responses:
        "200":
          description: Rights summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightsSummaryResponse"
        "401":
          description: Not authenticated
  /api/v1/account/security:
    get:
      tags:
        - Account
      operationId: getAccountSecurity
      summary: Current operator account security status
      security:
        - session: []
      responses:
        "200":
          description: Account security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSecurityResponse"
        "401":
          description: Not authenticated
    post:
      tags:
        - Account
      operationId: startAccountMfaEnrollment
      summary: Start MFA enrollment for the current operator
      security:
        - session: []
      responses:
        "200":
          description: MFA enrollment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSecurityResponse"
        "401":
          description: Not authenticated
        "409":
          description: MFA is already pending or active
  /api/v1/account/security/mfa:
    delete:
      tags:
        - Account
      operationId: cancelAccountMfaEnrollment
      summary: Cancel pending MFA enrollment for the current operator
      security:
        - session: []
      responses:
        "200":
          description: Pending MFA enrollment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSecurityResponse"
        "401":
          description: Not authenticated
        "409":
          description: MFA enrollment is not pending
  /api/v1/account/security/mfa/confirm:
    post:
      tags:
        - Account
      operationId: confirmAccountMfaEnrollment
      summary: Confirm MFA enrollment with a verification code
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAccountMfaEnrollmentRequest"
      responses:
        "200":
          description: MFA enrollment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSecurityResponse"
        "400":
          description: MFA enrollment is not pending
        "401":
          description: Not authenticated
        "409":
          description: MFA verification code is invalid
  /api/v1/account/keys:
    get:
      tags:
        - Account
      operationId: listAccountKeys
      summary: List personal TSIG key files for the current operator
      security:
        - session: []
      responses:
        "200":
          description: Personal key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountKeyListResponse"
        "401":
          description: Not authenticated
    post:
      tags:
        - Account
      operationId: uploadAccountKey
      x-use-rest-response: true
      summary: Upload a new personal TSIG key file
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAccountKeyRequest"
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountKeySummary"
        "400":
          description: Invalid key content or filename
        "401":
          description: Not authenticated
        "409":
          description: Key filename already exists
  /api/v1/account/keys/{keyName}:
    get:
      tags:
        - Account
      operationId: getAccountKey
      summary: Read a personal TSIG key file
      security:
        - session: []
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountKeyDetail"
        "401":
          description: Not authenticated
        "404":
          description: Key not found
    put:
      tags:
        - Account
      operationId: updateAccountKey
      summary: Update personal TSIG key content
      security:
        - session: []
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountKeyRequest"
      responses:
        "200":
          description: Key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountKeySummary"
        "400":
          description: Invalid key content
        "401":
          description: Not authenticated
        "404":
          description: Key not found
    delete:
      tags:
        - Account
      operationId: deleteAccountKey
      summary: Delete a personal TSIG key file
      security:
        - session: []
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Key deleted
        "401":
          description: Not authenticated
        "404":
          description: Key not found
        "409":
          description: Key is referenced by one or more zone catalog entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInUseError"
  /api/v1/account/keys/{keyName}/replace:
    post:
      tags:
        - Account
      operationId: replaceAccountKey
      summary: Replace personal TSIG key content from uploaded file text
      security:
        - session: []
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAccountKeyRequest"
      responses:
        "200":
          description: Key replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountKeySummary"
        "400":
          description: Invalid key content
        "401":
          description: Not authenticated
        "404":
          description: Key not found
  /api/v1/account/keys/{keyName}/download:
    get:
      tags:
        - Account
      operationId: downloadAccountKey
      summary: Download a personal TSIG key file
      security:
        - session: []
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key file bytes
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Key not found
  /api/v1/keys/selectable:
    get:
      tags:
        - Keys
      operationId: listSelectableKeys
      summary: List TSIG keys the current operator may attach to a zone
      description: >
        Own keys are labeled by filename. Group keys for member groups are labeled
        as groupname/filename. Group key entries do not include download URLs.
      security:
        - session: []
      responses:
        "200":
          description: Selectable keys for the zone key picker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectableKeysResponse"
        "401":
          description: Not authenticated
  /api/v1/keys/missing:
    get:
      tags:
        - Keys
      operationId: listMissingKeys
      summary: Summarize missing key files referenced by readable zone catalog entries
      description: >
        Non-admin operators see missing keys only for zones they can read.
        Admins see all missing key references in the catalog.
      security:
        - session: []
      responses:
        "200":
          description: Missing key summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingKeysResponse"
        "401":
          description: Not authenticated
  /api/v1/health:
    get:
      tags:
        - Reconciliation
      operationId: getHealth
      summary: Service health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/status:
    get:
      tags:
        - Reconciliation
      operationId: getReconciliationStatus
      summary: Last reconciliation run status
      security:
        - session: []
      responses:
        "200":
          description: Status of the most recent reconciliation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
        "401":
          description: Not authenticated
  /api/v1/reconcile:
    post:
      tags:
        - Reconciliation
      operationId: triggerReconciliation
      summary: Trigger reconciliation for all zones
      security:
        - session: []
      parameters:
        - name: dryRun
          in: query
          required: false
          description: >
            When omitted, uses the service configuration value `dnscheck.dry-run`.
            When present, overrides the configured default for this run.
          schema:
            type: boolean
      responses:
        "200":
          description: Reconciliation run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks global admin access
  /api/v1/zones:
    get:
      tags:
        - Zones
      operationId: listZones
      summary: List zone definitions visible to the current operator
      security:
        - session: []
      responses:
        "200":
          description: Zone catalog entries with validation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCatalogResponse"
        "401":
          description: Not authenticated
    post:
      tags:
        - Zones
      operationId: createZone
      x-use-rest-response: true
      summary: Create a new zone definition in the catalog
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneRequest"
      responses:
        "201":
          description: Zone definition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCatalogEntry"
        "400":
          description: Invalid zone definition request
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks zone-create access
        "409":
          description: Zone definition already exists
  /api/v1/zones/{owner}/{zoneName}:
    patch:
      tags:
        - Zones
      operationId: updateZone
      summary: Update nameserver and/or key file for a zone definition
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneRequest"
      responses:
        "200":
          description: Updated zone catalog entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCatalogEntry"
        "400":
          description: Invalid update request
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks zone-create access
        "404":
          description: Zone definition not found
    delete:
      tags:
        - Zones
      operationId: deleteZone
      summary: Remove a zone definition from the catalog
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Zone definition removed
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks zone-create access
        "404":
          description: Zone definition not found
  /api/v1/zones/{owner}/{zoneName}/transfer:
    post:
      tags:
        - Zones
      operationId: transferZone
      summary: Transfer a zone definition to another owner folder
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Current owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferZoneRequest"
      responses:
        "200":
          description: Zone catalog entry after transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCatalogEntry"
        "400":
          description: Invalid transfer request
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks transfer access for this zone
        "404":
          description: Zone definition not found
        "409":
          description: Target catalog entry already exists
  /api/v1/zones/{owner}/{zoneName}/records:
    post:
      tags:
        - Zones
      operationId: createZoneRecord
      summary: Create a DNS record with optional enforcement
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "200":
          description: Updated zone view after record creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or record not found
    delete:
      tags:
        - Zones
      operationId: deleteZoneRecord
      summary: Delete a record from live DNS and the zone definition if present
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRef"
      responses:
        "200":
          description: Updated zone view after deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or record not found
    patch:
      tags:
        - Zones
      operationId: modifyZoneRecord
      summary: Modify a managed or ad-hoc live record (rdata and/or TTL)
      description: >
        When the record exists in the zone definition, updates the managed record
        in JSON and applies matching live DNS changes. When the record is ad-hoc
        (live only), updates live DNS only and does not write the zone definition.
        Name and type are immutable; supply newRdata and/or newTtl. For ad-hoc
        records, omitting newTtl leaves the live TTL unchanged.
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyRecordRequest"
      responses:
        "200":
          description: Updated zone view after modification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "400":
          description: Invalid modification request
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or record not found
  /api/v1/zones/{owner}/{zoneName}/records/promote:
    post:
      tags:
        - Zones
      operationId: promoteZoneRecord
      summary: Promote an ad-hoc live record into the zone definition
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRecordRequest"
      responses:
        "200":
          description: Updated zone view after promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "400":
          description: Record is not eligible for promotion
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or record not found
  /api/v1/zones/{owner}/{zoneName}/records/demote:
    post:
      tags:
        - Zones
      operationId: demoteZoneRecord
      summary: Demote an enforced record out of the zone definition
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRef"
      responses:
        "200":
          description: Updated zone view after demotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "400":
          description: Record is not eligible for demotion
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or record not found
  /api/v1/zones/{owner}/{zoneName}/reconcile:
    post:
      tags:
        - Zones
      operationId: triggerZoneReconciliation
      summary: Trigger reconciliation for a single zone
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
        - name: dryRun
          in: query
          required: false
          description: >
            When omitted, uses the service configuration value `dnscheck.dry-run`.
            When present, overrides the configured default for this run.
          schema:
            type: boolean
      responses:
        "200":
          description: Reconciliation run completed for the zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone definition not found
        "409":
          description: Referenced key file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingKeyError"
  /api/v1/zones/{owner}/{zoneName}/deletion-markers:
    post:
      tags:
        - Zones
      operationId: createDeletionMarker
      summary: Add a deletion marker to the zone definition
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionMarkerRequest"
      responses:
        "200":
          description: Updated zone view after adding deletion marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone definition not found
        "409":
          description: Deletion marker already exists
    delete:
      tags:
        - Zones
      operationId: deleteDeletionMarker
      summary: Remove a deletion marker from the zone definition
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionMarkerRequest"
      responses:
        "200":
          description: Updated zone view after removing deletion marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks write access to this zone
        "404":
          description: Zone or deletion marker not found
  /api/v1/zones/{owner}/{zoneName}/view:
    get:
      tags:
        - ZoneView
      operationId: getZoneView
      summary: Read-only merged view of a zone
      security:
        - session: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Owner folder (e.g. admin.u or dns-team.g)
        - name: zoneName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Live zone merged with zone definition and per-record status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneViewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks read access to this zone
        "404":
          description: Zone definition not found
        "409":
          description: Referenced key file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingKeyError"
        "502":
          description: Live zone could not be loaded (for example AXFR failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/v1/admin/operators:
    get:
      tags:
        - Admin
      operationId: listOperators
      summary: List all operators
      security:
        - session: []
      responses:
        "200":
          description: Operators in the system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorListResponse"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks admin access
    post:
      tags:
        - Admin
      operationId: createOperator
      summary: Create a new operator account
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperatorRequest"
      responses:
        "200":
          description: Operator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSummary"
        "401":
          description: Not authenticated
        "403":
          description: Operator lacks admin access
        "409":
          description: Username already exists
  /api/v1/admin/operators/{operatorId}:
    get:
      tags:
        - Admin
      operationId: getOperator

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: DNSCHECK_SESSION
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        mfaCode:
          type: string
    LoginResponse:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    AccountMfaStatus:
      type: string
      enum:
        - disabled
        - pending
        - active
    AccountSecurityResponse:
      type: object
      required:
        - mfaStatus
      properties:
        mfaStatus:
          $ref: "#/components/schemas/AccountMfaStatus"
        setupKey:
          type: string
        otpauthUri:
          type: string
        recoveryCodes:
          type: array
          items:
            type: string
    ConfirmAccountMfaEnrollmentRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    RightSourceType:
      type: string
      enum:
        - direct
        - group
    RightSource:
      type: object
      required:
        - type
        - editable
      properties:
        type:
          $ref: "#/components/schemas/RightSourceType"
        groupName:
          type: string
        grantId:
          type: integer
          format: int64
        editable:
          type: boolean
    GlobalRightEntry:
      type: object
      required:
        - kind
        - granted
        - sources
      properties:
        kind:
          $ref: "#/components/schemas/AdminGlobalRight"
        granted:
          type: boolean
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RightSource"
    ZoneRightEntry:
      type: object
      required:
        - ownerFolder
        - zoneName
        - kind
        - sources
      properties:
        ownerFolder:
          type: string
          description: Owner folder for the catalog entry (e.g. admin.u)
        zoneName:
          type: string
        kind:
          $ref: "#/components/schemas/AdminZoneRight"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RightSource"
    RightsSummaryResponse:
      type: object
      required:
        - globalRights
        - zoneRights
      properties:
        globalRights:
          type: array
          items:
            $ref: "#/components/schemas/GlobalRightEntry"
        zoneRights:
          type: array
          items:
            $ref: "#/components/schemas/ZoneRightEntry"
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
    ReconciliationStatusResponse:
      type: object
      required:
        - status
        - dryRun
        - zonesDir
        - zoneOutcomes
      properties:
        status:
          type: string
          enum:
            - never_run
            - completed
            - failed
        startedAt:
          type: string
          format: date-time
        dryRun:
          type: boolean
        zonesDir:
          type: string
        zoneOutcomes:
          type: array
          items:
            $ref: "#/components/schemas/ZoneOutcome"
    ZoneOutcome:
      type: object
      required:
        - zone
        - outcome
        - plannedChanges
      properties:
        zone:
          type: string
        outcome:
          type: string
          enum:
            - SUCCESS
            - RECONCILED
            - DRIFT_DETECTED
            - FAILED
        plannedChanges:
          type: array
          items:
            type: string
        error:
          type: string
    ZoneCatalogResponse:
      type: object
      required:
        - zonesDir
        - entries
      properties:
        zonesDir:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ZoneCatalogEntry"
    CreateZoneRequest:
      type: object
      required:
        - owner
        - zone
        - nameserver
        - keyFile
      properties:
        owner:
          type: string
          description: Target owner folder (e.g. admin.u or dns-team.g)
        zone:
          type: string
        nameserver:
          type: string
        keyFile:
          type: string
    UpdateZoneRequest:
      type: object
      properties:
        nameserver:
          type: string
        keyFile:
          type: string
    TransferZoneRequest:
      type: object
      required:
        - targetOwner
      properties:
        targetOwner:
          type: string
          description: Destination owner folder (e.g. dns-team.g)
    CreateRecordRequest:
      type: object
      required:
        - name
        - type
        - rdata
        - enforce
      properties:
        name:
          type: string
        type:
          type: string
        rdata:
          type: string
        ttl:
          type: integer
          format: int32
        enforce:
          type: boolean
    RecordRef:
      type: object
      required:
        - name
        - type
        - rdata
      properties:
        name:
          type: string
        type:
          type: string
        rdata:
          type: string
    DeletionMarkerRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        rdataPattern:
          type: string
          description: Optional glob pattern; omitted or empty matches all rdata at the name
    PromoteRecordRequest:
      allOf:
        - $ref: "#/components/schemas/RecordRef"
        - type: object
          properties:
            ttl:
              type: integer
              format: int32
    ModifyRecordRequest:
      type: object
      required:
        - name
        - type
        - rdata
      properties:
        name:
          type: string
        type:
          type: string
        rdata:
          type: string
        newRdata:
          type: string
        newTtl:
          type: integer
          format: int32
    ZoneCatalogEntry:
      type: object
      required:
        - ownerFolder
        - zone
        - filename
        - valid
      properties:
        ownerFolder:
          type: string
        zone:
          type: string
        filename:
          type: string
        valid:
          type: boolean
        error:
          type: string
        nameserver:
          type: string
    ZoneViewResponse:
      type: object
      required:
        - zone
        - defaultTtl
        - records
      properties:
        zone:
          type: string
        defaultTtl:
          type: integer
          format: int64
        records:
          type: array
          items:
            $ref: "#/components/schemas/ZoneViewRecord"
    ZoneViewRecord:
      type: object
      required:
        - name
        - type
        - status
      properties:
        name:
          type: string
        type:
          type: string
        status:
          $ref: "#/components/schemas/ZoneViewRecordStatus"
        rdata:
          type: string
        ttl:
          type: integer
          format: int64
        expectedRdata:
          type: string
        expectedTtl:
          type: integer
          format: int64
    ZoneViewRecordStatus:
      type: string
      enum:
        - enforced
        - ad_hoc
        - drifted
        - missing
        - marked_for_deletion
    OperatorSummary:
      type: object
      required:
        - id
        - username
        - enabled
        - groupNames
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        enabled:
          type: boolean
        groupNames:
          type: array
          items:
            type: string
    OperatorListResponse:
      type: object
      required:
        - operators
      properties:
        operators:
          type: array
          items:
            $ref: "#/components/schemas/OperatorSummary"
    CreateOperatorRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    UpdateOperatorRequest:
      type: object
      properties:
        enabled:
          type: boolean
        password:
          type: string
          format: password
    GroupSummary:
      type: object
      required:
        - id
        - name
        - memberUsernames
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        memberUsernames:
          type: array
          items:
            type: string
    GroupListResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    AdminGlobalRight:
      type: string
      enum:
        - admin
        - zone_create
    AdminZoneRight:
      type: string
      enum:
        - read
        - write
    GlobalGrantSummary:
      type: object
      required:
        - id
        - kind
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/AdminGlobalRight"
        operatorUsername:
          type: string
        groupName:
          type: string
    GlobalGrantListResponse:
      type: object
      required:
        - grants
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/GlobalGrantSummary"
    CreateGlobalGrantRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/AdminGlobalRight"
        operatorId:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
    ZoneGrantSummary:

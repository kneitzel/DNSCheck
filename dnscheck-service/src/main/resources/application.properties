# Application
quarkus.application.name=dnscheck-service

# Supported auth databases: h2, hsql, postgresql, mariadb
# Set quarkus.datasource.db-kind and quarkus.datasource.jdbc.url for your deployment.
# Examples:
#   H2:         jdbc:h2:file:./data/dnscheck;DB_CLOSE_DELAY=-1
#   HSQL:       jdbc:hsql:file:./data/dnscheck;shutdown=true
#   PostgreSQL: jdbc:postgresql://localhost:5432/dnscheck
#   MariaDB:    jdbc:mariadb://localhost:3306/dnscheck

# HTTP
quarkus.http.port=8080

# DNSCheck paths
dnscheck.zones.dir=${DNSCHECK_ZONES_DIR:./zones}
dnscheck.keys.dir=${DNSCHECK_KEYS_DIR:./keys}
dnscheck.dry-run=false
dnscheck.schedule.interval=15m

# Database (dev: file-based H2)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/dnscheck;DB_CLOSE_DELAY=-1
quarkus.datasource.username=dnscheck
quarkus.datasource.password=dnscheck
quarkus.hibernate-orm.database.generation=update

# Dev-only default admin bootstrap
%dev.dnscheck.bootstrap.admin-username=admin
%dev.dnscheck.bootstrap.admin-password=admin

# Test profile bootstrap for REST Assured
%test.dnscheck.bootstrap.admin-username=admin
%test.dnscheck.bootstrap.admin-password=admin

# Production bootstrap: set both env vars to override, or omit both to auto-generate
# admin with a random password logged once at startup.
%prod.dnscheck.bootstrap.admin-username=${DNSCHECK_BOOTSTRAP_ADMIN_USERNAME:}
%prod.dnscheck.bootstrap.admin-password=${DNSCHECK_BOOTSTRAP_ADMIN_PASSWORD:}

# Tests should not run background reconciliation
%test.quarkus.scheduler.enabled=false
%test.dnscheck.dry-run=true
%test.dnscheck.zones.dir=target/test-zones
%test.dnscheck.keys.dir=target/test-keys

# HSQL profile example (use with -Dquarkus.profile=hsql)
%hsql.quarkus.datasource.db-kind=other
%hsql.quarkus.datasource.jdbc.driver=org.hsqldb.jdbc.JDBCDriver
%hsql.quarkus.datasource.jdbc.url=jdbc:hsql:file:./data/dnscheck-hsql;shutdown=true
%hsql.quarkus.datasource.username=sa
%hsql.quarkus.datasource.password=

# Quinoa / React frontend (Vite project under src/main/frontend)
quarkus.quinoa.ui-dir=src/main/frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173

# CORS for dev (Quinoa proxies in dev mode)
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# OpenAPI contract-first generation
quarkus.openapi.generator.server.use=openapitools
quarkus.openapi.generator.server.input-base-dir=src/main/resources
quarkus.openapi.generator.server.spec=openapi.yml
quarkus.openapi.generator.server.base-package=de.neitzel.dnscheck.service.api.generated

# Serve the checked-in spec from META-INF/openapi.yml; disable annotation scanning
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/api/v1/openapi.json

# Swagger UI dev only
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/swagger-ui
%prod.quarkus.swagger-ui.enable=false

# HTTP auth: public endpoints vs session-protected API
quarkus.http.auth.permission.health.paths=/api/v1/health
quarkus.http.auth.permission.health.policy=permit

quarkus.http.auth.permission.auth.paths=/api/v1/auth/login,/api/v1/auth/logout
quarkus.http.auth.permission.auth.policy=permit

quarkus.http.auth.permission.openapi.paths=/api/v1/openapi.json
quarkus.http.auth.permission.openapi.policy=permit

quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated
